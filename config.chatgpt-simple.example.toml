[server]
bind = "127.0.0.1:8787"
public_base_url = "https://your-tailnet-or-funnel-hostname"
# Replace the token segment with a long random value generated by:
#   openssl rand -hex 32
# ChatGPT Developer Mode supports OAuth or no auth for custom MCP connectors.
# If you do not have OAuth, this secret URL is the barebones protection layer.
mcp_path = "/mcp/REPLACE_WITH_64_HEX_SECRET"

[tools]
prefix = "agentbox_"

[exec]
default_workdir = "/home/agent"
default_shell = "/bin/bash"
login_default = true
default_yield_time_ms = 1000
min_yield_time_ms = 50
max_yield_time_ms = 30000
default_max_output_tokens = 6000
hard_max_output_tokens = 50000
max_processes = 64
session_idle_ttl_seconds = 86400
overlay_codex_env = true
deterministic_session_ids = false

[auth]
# For ChatGPT web without OAuth, use a secret unguessable URL path and choose
# "No authentication" in ChatGPT. Keep the server bound to 127.0.0.1 and expose
# only through HTTPS Funnel.
mode = "none"

[auth.static_bearer]
token_env = "agentbox_MCP_TOKEN"

[auth.oauth]
resource = "https://agentbox.example.com"
issuer = "https://auth.example.com"
jwks_url = "https://auth.example.com/.well-known/jwks.json"
audience = "https://agentbox.example.com"
required_scopes = ["agentbox:exec"]

[skills]
enabled = true
roots = [
  "/home/agent/.agents",
  "/opt/agentbox/skills",
]

[bootstrap]
project_roots = [
  "/home/agent/dev",
  "/srv/projects",
]
