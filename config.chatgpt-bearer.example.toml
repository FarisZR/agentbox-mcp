[server]
bind = "127.0.0.1:8787"
public_base_url = "https://your-tailnet-or-funnel-hostname"
mcp_path = "/mcp"

[tools]
prefix = "agentbox_"

[exec]
default_workdir = "/home/agent"
default_shell = "/bin/bash"
login_default = true
default_yield_time_ms = 1000
min_yield_time_ms = 50
max_yield_time_ms = 30000
default_max_output_tokens = 6000
hard_max_output_tokens = 50000
max_processes = 64
session_idle_ttl_seconds = 86400
overlay_codex_env = true
deterministic_session_ids = false

[auth]
mode = "static_bearer"

[auth.static_bearer]
# Replace with a long random value generated by:
#   openssl rand -hex 32
# In ChatGPT, choose API key / bearer token authentication and paste this token.
token = "REPLACE_WITH_64_HEX_BEARER_TOKEN"
token_env = "agentbox_MCP_TOKEN"

[auth.oauth]
resource = "https://agentbox.example.com"
issuer = "https://auth.example.com"
jwks_url = "https://auth.example.com/.well-known/jwks.json"
audience = "https://agentbox.example.com"
required_scopes = ["agentbox:exec"]

[skills]
enabled = true
roots = [
  "/home/agent/.agents",
  "/opt/agentbox/skills",
]

[bootstrap]
project_roots = [
  "/home/agent/dev",
  "/srv/projects",
]
